name: Uykuva CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uykuva-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check TypeScript
        run: npm run typecheck

      - name: Check Expo SDK compatibility
        run: npm run doctor

      - name: Validate store build profile
        shell: bash
        run: |
          node <<'NODE'
          const assert = require("node:assert/strict");
          const app = require("./app.json").expo;
          const production = require("./eas.json").build.production;

          assert.equal(app.name, "Uykuva");
          assert.equal(app.slug, "uykuva");
          assert.equal(app.ios.bundleIdentifier, "com.uykuva.app");
          assert.equal(app.android.package, "com.uykuva.app");
          assert.equal(production.autoIncrement, true);
          assert.equal(production.android.buildType, "app-bundle");
          assert.equal(production.env?.EXPO_PUBLIC_ENABLE_CLOUD_SYNC, "false");
          assert.equal(production.ios.image, "macos-tahoe-26.5-xcode-26.6");
          console.log("Verified production identifiers, signed store package type, pinned Xcode image, and cloud-sync-off default.");
          NODE

      - name: Run app tests
        run: npm test

      - name: Set up Supabase CLI
        id: setup_supabase
        uses: supabase/setup-cli@v3

      - name: Start local Supabase stack
        run: supabase start

      - name: Run database access tests
        run: supabase test db

      - name: Stop local Supabase stack
        if: always() && steps.setup_supabase.outcome == 'success'
        run: supabase stop

  android-release-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 17 compile platform from preview channel
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"

      - name: Install Expo SDK 58 native toolchain
        run: sdkmanager "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Install dependencies
        run: npm ci

      - name: Generate clean Android project
        run: npx expo prebuild --clean --platform android

      - name: Build Android release bundle
        working-directory: android
        run: ./gradlew --no-daemon :app:bundleRelease

      - name: Verify Play target API in generated release manifest
        shell: bash
        run: |
          manifest="$(find android/app/build/intermediates -type f -path '*release*' -name AndroidManifest.xml -print0 | xargs -0 grep -l 'targetSdkVersion="36"' | head -n 1)"
          if [ -z "$manifest" ]; then
            echo "Release manifest does not declare targetSdkVersion 36."
            find android/app/build/intermediates -type f -path '*release*' -name AndroidManifest.xml -print
            exit 1
          fi
          echo "Verified targetSdkVersion 36 in $manifest"

  ios-native-build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify Apple build SDK
        shell: bash
        run: |
          xcodebuild -version
          ios_sdk="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          echo "iOS simulator SDK: $ios_sdk"
          ios_sdk_major="${ios_sdk%%.*}"
          if [ "$ios_sdk_major" -lt 26 ]; then
            echo "App Store uploads require an iOS 26 SDK or later."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Generate clean iOS project
        run: npx expo prebuild --clean --platform ios

      - name: Build iOS Release for simulator
        run: xcodebuild -derivedDataPath build/ios-derived-data -workspace ios/Uykuva.xcworkspace -scheme Uykuva -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

      - name: Launch iOS Release app on simulator
        shell: bash
        run: |
          set -euo pipefail
          simulator_udid="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          if [ -z "$simulator_udid" ]; then
            echo "No available iPhone simulator was found."
            exit 1
          fi

          xcrun simctl boot "$simulator_udid" 2>/dev/null || true
          xcrun simctl bootstatus "$simulator_udid" -b
          app_path="$GITHUB_WORKSPACE/build/ios-derived-data/Build/Products/Release-iphonesimulator/Uykuva.app"
          if [ ! -d "$app_path" ]; then
            echo "Release simulator app was not created at $app_path."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/build"
          xcrun simctl install "$simulator_udid" "$app_path"
          xcrun simctl launch "$simulator_udid" com.uykuva.app
          sleep 10
          xcrun simctl io "$simulator_udid" screenshot "$GITHUB_WORKSPACE/build/uykuva-iphone-first-launch.png"

      - name: Upload iOS first-launch screenshot
        uses: actions/upload-artifact@v4
        with:
          name: ios-first-launch-smoke
          path: build/uykuva-iphone-first-launch.png
          if-no-files-found: error
          retention-days: 14
